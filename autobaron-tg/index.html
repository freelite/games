<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="i18n.js?v=7"></script>
<script src="telegram-init.js"></script>
<title>АВТОБАРОН — от гаража до империи</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>

<div class="app" id="app">
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#" id="brandHome" data-action="go-tab" data-target="market" aria-label="АВТОБАРОН">
      <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="brandRim" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fcd34d"/>
            <stop offset=".55" stop-color="#34d399"/>
            <stop offset="1" stop-color="#10b981"/>
          </linearGradient>
        </defs>
        <path d="M12 1.5l8.2 3.1v6.2c0 5.1-3.4 9.6-8.2 11.9-4.8-2.3-8.2-6.8-8.2-11.9V4.6L12 1.5z" fill="#0b0e14" stroke="url(#brandRim)" stroke-width="1.35" stroke-linejoin="round"/>
        <path d="M12 3.1l6.7 2.5v5.2c0 4.2-2.7 7.9-6.7 9.9-4-2-6.7-5.7-6.7-9.9V5.6L12 3.1z" fill="none" stroke="#0f1720" stroke-width=".7"/>
        <path d="M6.9 14.4a5.6 5.6 0 0 1 10.2-.2" fill="none" stroke="#34d399" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M12 13.7l3-2.5" stroke="#fcd34d" stroke-width="1.55" stroke-linecap="round"/>
        <circle cx="12" cy="13.8" r="1.15" fill="#fcd34d"/>
      </svg>
      <span class="brand-text">
        <span class="brand-title">АВТОБАРОН</span>
        <span class="brand-sub">от гаража до империи</span>
      </span>
    </a>

    <nav class="tabs" id="desktopNav" aria-label="Разделы">
      <button class="tab is-active" data-tab="market">Рынок</button>
      <button class="tab" data-tab="garage">Гараж</button>
      <button class="tab" data-tab="business">Сервис и Бизнес</button>
      <button class="tab" data-tab="profile">Профиль</button>
    </nav>

    <div class="top-right">
      <div class="stat stat-money">
        <span class="stat-label">Капитал</span>
        <span class="stat-value money" id="moneyValue">180 000 ₽</span>
      </div>
      <div class="stat stat-rep">
        <span class="stat-label">Репутация</span>
        <span class="stat-value" id="repValue">10</span>
      </div>
      <div class="stat stat-garage">
        <span class="stat-label">Гараж</span>
        <span class="stat-value" id="garageValue">0/1</span>
      </div>
      <div class="top-actions">
      <div class="lang-switch lang-switch-top" role="group" aria-label="Язык интерфейса / Language">
        <button class="lang-btn" type="button" data-lang="ru">RU</button>
        <button class="lang-btn" type="button" data-lang="en">EN</button>
      </div>
      <button class="vip-btn" id="vipBtn" type="button" data-action="open-vip" aria-label="Закрытый клуб автобаронов">
        <svg class="vip-star-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="vipStarGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fde68a"/>
              <stop offset=".5" stop-color="#f59e0b"/>
              <stop offset="1" stop-color="#b45309"/>
            </linearGradient>
          </defs>
          <path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45L12 17.45 6.2 20.5l1.1-6.45L2.6 9.45l6.5-.95L12 2.6z" fill="url(#vipStarGrad)" stroke="#fbbf24" stroke-width=".9" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="icon-btn" id="helpBtn" type="button" data-action="open-welcome" aria-label="Как играть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M9.4 9.2a2.7 2.7 0 0 1 5.2 1c0 1.9-2.6 2.3-2.6 4"/>
          <path d="M12 17.4h.01"/>
        </svg>
      </button>
      <button class="icon-btn" id="fullscreenBtn" type="button" data-action="toggle-fullscreen" aria-label="Полный экран">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9"/>
          <path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9"/>
          <path d="M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15"/>
          <path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/>
        </svg>
      </button>
      <button class="icon-btn" id="muteBtn" type="button" data-action="toggle-mute" aria-label="Звук включён">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.4v5.2h3.3L12.7 19V5L7.3 9.4H4z"/>
          <g class="wave"><path d="M16.1 9a4.3 4.3 0 0 1 0 6"/><path d="M18.7 6.4a8.1 8.1 0 0 1 0 11.2"/></g>
          <g class="mute-x"><path d="M16.6 9.6l4.8 4.8"/><path d="M21.4 9.6l-4.8 4.8"/></g>
        </svg>
      </button>
      </div>
    </div>
  </div>
</header>

<main class="shell">
  <section class="view is-active" id="view-market" aria-label="Рынок"></section>
  <section class="view" id="view-garage" aria-label="Гараж"></section>
  <section class="view" id="view-business" aria-label="Сервис и бизнес"></section>
  <section class="view" id="view-profile" aria-label="Профиль"></section>
</main>

<nav class="bottomnav" id="bottomNav" aria-label="Основное меню">
  <button class="bnav-item is-active" data-tab="market">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 17.5l5-5 4 4 9-9"/><path d="M16 7.5h5v5"/>
    </svg>
    <span>Рынок</span>
  </button>
  <button class="bnav-item" data-tab="garage">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 16.5v3h16v-3"/><path d="M3.5 11l1.8-4.2A2 2 0 0 1 7.1 5.5h9.8a2 2 0 0 1 1.8 1.3L20.5 11"/>
      <path d="M3.5 11h17v5.5h-17z"/><path d="M7 16.5h.01"/><path d="M17 16.5h.01"/>
    </svg>
    <span>Гараж</span>
  </button>
  <button class="bnav-item" data-tab="business">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7"/>
      <path d="M3 12h18"/>
    </svg>
    <span>Бизнес</span>
  </button>
  <button class="bnav-item" data-tab="profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
    </svg>
    <span>Профиль</span>
  </button>
</nav>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modalRoot"></div>
<div class="ach-root" id="achRoot" aria-live="polite"></div>
<div class="ad-root" id="adRoot"></div>

<script src="game.js?v=7"></script>
</body>
</html>
